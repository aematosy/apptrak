name: Release Apptrak Binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS ARM64
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Bundle Apptrak
        run: pnpm exec tsup --config tsup.sea.config.ts

      - name: Generate SEA blob
        run: node --experimental-sea-config build/sea/sea-config.json

      - name: Create macOS binary
        shell: bash
        run: |
          cp "$(command -v node)" dist-sea/apptrak-macos-arm64

          codesign --remove-signature dist-sea/apptrak-macos-arm64 || true

          pnpm exec postject \
            dist-sea/apptrak-macos-arm64 \
            NODE_SEA_BLOB \
            dist-sea/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            --macho-segment-name NODE_SEA

          codesign --sign - dist-sea/apptrak-macos-arm64

          chmod +x dist-sea/apptrak-macos-arm64

      - name: Smoke test macOS binary
        shell: bash
        run: |
          printf '0\n' | ./dist-sea/apptrak-macos-arm64

      - name: Package macOS binary
        shell: bash
        run: |
          cd dist-sea
          tar -czf apptrak-macos-arm64.tar.gz apptrak-macos-arm64

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: apptrak-macos-arm64
          path: dist-sea/apptrak-macos-arm64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Bundle Apptrak
        run: pnpm exec tsup --config tsup.sea.config.ts

      - name: Generate SEA blob
        run: node --experimental-sea-config build/sea/sea-config.json

      - name: Create Windows binary
        shell: pwsh
        run: |
          node -e "require('fs').copyFileSync(process.execPath, 'dist-sea/apptrak-windows-x64.exe')"

          pnpm exec postject `
            dist-sea/apptrak-windows-x64.exe `
            NODE_SEA_BLOB `
            dist-sea/sea-prep.blob `
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Smoke test Windows binary
        shell: pwsh
        run: |
          "0" | .\dist-sea\apptrak-windows-x64.exe

      - name: Package Windows binary
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist-sea\apptrak-windows-x64.exe `
            -DestinationPath dist-sea\apptrak-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: apptrak-windows-x64
          path: dist-sea/apptrak-windows-x64.zip
          if-no-files-found: error

  publish:
    name: Publish Binary Release
    needs:
      - build-macos
      - build-windows

    runs-on: ubuntu-latest

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Show assets
        run: ls -lah release-assets

      - name: Create release repository release
        env:
          GH_TOKEN: ${{ secrets.APPTRAK_RELEASE_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            release-assets/apptrak-macos-arm64.tar.gz \
            release-assets/apptrak-windows-x64.zip \
            --repo aematosy/apptrak-releases \
            --target main \
            --title "Apptrak $VERSION" \
            --notes "Binary distribution of Apptrak $VERSION.

          Platforms:
          - macOS Apple Silicon (ARM64)
          - Windows x64

          Source code is maintained separately."
